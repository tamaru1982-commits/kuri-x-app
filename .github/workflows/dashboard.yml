# 15分おきに実行: trading_system.dbの内容からdocs/index.htmlを生成し、
# GitHub Pagesで公開する。他の通知ワークフローがDBを更新した後を追いかける形で
# 状況を可視化する(通知が来た瞬間以外でもいつでも確認できるようにするため)。

name: Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ダッシュボード生成
        run: python dashboard_generator.py

      - name: docs/index.htmlをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "update dashboard"
          git push
