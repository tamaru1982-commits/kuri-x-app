# 15分おきに実行: trading_system.dbの内容からdocs/index.html(ダッシュボード)・
# docs/about.html(説明ページ、クジラ規模分布を含む)・docs/weekly.html(ペーパー
# トレードの週次レポート)を生成し、GitHub Pagesで公開する。他の通知ワークフローが
# DBを更新した後を追いかける形で状況を可視化する(通知が来た瞬間以外でもいつでも
# 確認できるようにするため)。

name: Dashboard

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリ(trading_system.db等)に書き込むワークフローは、この共通グループで
# 直列化する。SQLiteのDBはバイナリでgitがマージできないため、2本が同時に走ると
# 後からpushした側が弾かれ、その回の検知結果が丸ごと消える(実際に2026-08-28に
# クジラ検知が1件失われた)。同時実行そのものを起こさないよう、cronの分も
# 互いに3分以上ずらしてある。
concurrency:
  group: trading-repo-write
  cancel-in-progress: false

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ダッシュボード生成
        run: python dashboard_generator.py

      - name: docs/*.htmlをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/about.html docs/weekly.html
          git diff --staged --quiet || git commit -m "update dashboard"
          # 直列化していても手動実行や手元からのpushと重なることはあるため、
          # 弾かれたらリモートを取り込んで再試行する(取り込めない場合は
          # 黙って失うより落とした方が安全なのでエラー終了する)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "pushが弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash || exit 1
          done
          git push
