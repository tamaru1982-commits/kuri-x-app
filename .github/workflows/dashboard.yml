# 15分おきに実行: trading_system.dbの内容からdocs/index.html(ダッシュボード)・
# docs/about.html(説明ページ、クジラ規模分布を含む)・docs/weekly.html(ペーパー
# トレードの週次レポート)を生成し、GitHub Pagesで公開する。他の通知ワークフローが
# DBを更新した後を追いかける形で状況を可視化する(通知が来た瞬間以外でもいつでも
# 確認できるようにするため)。

name: Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ダッシュボード生成
        run: python dashboard_generator.py

      - name: docs/*.htmlをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/about.html docs/weekly.html
          git diff --staged --quiet || git commit -m "update dashboard"
          git push
