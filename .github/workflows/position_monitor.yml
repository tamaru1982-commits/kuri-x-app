# 15分おき(paper_trader.ymlの5分後)に実行: journalに記録した保有中ポジションを監視し、
# 利確目標到達・損切りライン到達・テクニカル売りサイン発生のいずれかがあれば通知する。
# ペーパートレード(is_paper=1)はここで検知次第、人の判断を待たず自動決済される。

name: Position Monitor

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリ(trading_system.db等)に書き込むワークフローは、この共通グループで
# 直列化する。SQLiteのDBはバイナリでgitがマージできないため、2本が同時に走ると
# 後からpushした側が弾かれ、その回の検知結果が丸ごと消える(実際に2026-08-28に
# クジラ検知が1件失われた)。同時実行そのものを起こさないよう、cronの分も
# 互いに3分以上ずらしてある。
concurrency:
  group: trading-repo-write
  cancel-in-progress: false

jobs:
  check-positions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install requests

      - name: ポジション監視
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # POSITION_TARGET_PROFIT_PCT / POSITION_ALERT_COOLDOWN_HOURS / POSITION_TECH_LOOKBACK_HOURS は
          # 任意設定。Secretsが未設定だと空文字列が渡りスクリプト側のデフォルト値処理が壊れるため、
          # 変更したい場合のみ値を設定して追加してください。
          # POSITION_TARGET_PROFIT_PCT: ${{ secrets.POSITION_TARGET_PROFIT_PCT }}
          # POSITION_ALERT_COOLDOWN_HOURS: ${{ secrets.POSITION_ALERT_COOLDOWN_HOURS }}
          # POSITION_TECH_LOOKBACK_HOURS: ${{ secrets.POSITION_TECH_LOOKBACK_HOURS }}
        run: python position_monitor.py

      - name: DB・状態ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system.db position_monitor_state.json
          git diff --staged --quiet || git commit -m "update position monitor state"
          # 直列化していても手動実行や手元からのpushと重なることはあるため、
          # 弾かれたらリモートを取り込んで再試行する(取り込めない場合は
          # 黙って失うより落とした方が安全なのでエラー終了する)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "pushが弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash || exit 1
          done
          git push
