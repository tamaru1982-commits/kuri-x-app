# 毎時15分に実行: シグナルが目標%(既定+5%)に1〜3日以内(既定72時間)で到達したかを
# 価格推移全体から判定し、到達までの時間・到達前の最大逆行幅を記録する。
# accuracy_tracker.yml(1h/24h時点のスナップショット判定)とは別の、目標達成型の
# 短期トレード戦略を検証するための仕組み。

name: Target Tracker

on:
  schedule:
    - cron: "54 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリ(trading_system.db等)に書き込むワークフローは、この共通グループで
# 直列化する。SQLiteのDBはバイナリでgitがマージできないため、2本が同時に走ると
# 後からpushした側が弾かれ、その回の検知結果が丸ごと消える(実際に2026-08-28に
# クジラ検知が1件失われた)。同時実行そのものを起こさないよう、cronの分も
# 互いに3分以上ずらしてある。
concurrency:
  group: trading-repo-write
  cancel-in-progress: false

jobs:
  check-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install requests pandas

      - name: 目標到達判定
        # TARGET_PCT / TARGET_WINDOW_HOURS は任意設定。Secretsが未設定だと空文字列が渡り
        # スクリプト側のデフォルト値処理が壊れるため、変更したい場合のみ値を設定して追加してください。
        # env:
        #   TARGET_PCT: ${{ secrets.TARGET_PCT }}
        #   TARGET_WINDOW_HOURS: ${{ secrets.TARGET_WINDOW_HOURS }}
        run: python target_tracker.py

      - name: DBをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system.db
          git diff --staged --quiet || git commit -m "update target tracking"
          # 直列化していても手動実行や手元からのpushと重なることはあるため、
          # 弾かれたらリモートを取り込んで再試行する(取り込めない場合は
          # 黙って失うより落とした方が安全なのでエラー終了する)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "pushが弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash || exit 1
          done
          git push
