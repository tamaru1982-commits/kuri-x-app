# 15分おきに実行: 各シグナルソース(tech/dip/whale/confluence/macro)からLONGが
# 発生するたびに、実際には買わず仮想ポジション(ペーパートレード)としてjournalに
# 自動記録する。決済はposition_monitor.ymlが既存の監視ロジックで自動的に行う。
#
# 実弾を使わずに「毎回シグナル通りに買っていたら」を継続検証するための仕組み。

name: Paper Trader

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリ(trading_system.db等)に書き込むワークフローは、この共通グループで
# 直列化する。SQLiteのDBはバイナリでgitがマージできないため、2本が同時に走ると
# 後からpushした側が弾かれ、その回の検知結果が丸ごと消える(実際に2026-08-28に
# クジラ検知が1件失われた)。同時実行そのものを起こさないよう、cronの分も
# 互いに3分以上ずらしてある。
concurrency:
  group: trading-repo-write
  cancel-in-progress: false

jobs:
  open-paper-trades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install requests

      - name: ペーパートレード記録
        # PAPER_NOTIONAL_USD は任意設定。Secretsが未設定だと空文字列が渡り
        # スクリプト側のデフォルト値処理が壊れるため、変更したい場合のみ値を設定して追加してください。
        # env:
        #   PAPER_NOTIONAL_USD: ${{ secrets.PAPER_NOTIONAL_USD }}
        run: python paper_trader.py

      - name: DB・状態ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system.db paper_trader_state.json
          git diff --staged --quiet || git commit -m "update paper trader state"
          # 直列化していても手動実行や手元からのpushと重なることはあるため、
          # 弾かれたらリモートを取り込んで再試行する(取り込めない場合は
          # 黙って失うより落とした方が安全なのでエラー終了する)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "pushが弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash || exit 1
          done
          git push
