# .github/workflows/x_signal.yml に配置してください。
# 指定時間帯のみ15分おきに実行: 指定Xアカウントの投稿をキーワード監視しDiscordに通知
#
# 実行時間帯(JST): 7,8,12,13,15,17,19,20,21,22,23,24(0),1,2時 のみ
#   -> UTC: 22,23,3,4,6,8,10,11,12,13,14,15,16,17時 (cronはUTC基準)
#
# 注意: X APIは従量課金です。cronの頻度・時間帯はAPI利用料と相談して調整してください。

name: X Signal Notifier

on:
  schedule:
    - cron: "21,51 3,4,6,8,10,11,12,13,14,15,16,17,22,23 * * *"  # 指定時間帯のみ15分おき
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリ(trading_system.db等)に書き込むワークフローは、この共通グループで
# 直列化する。SQLiteのDBはバイナリでgitがマージできないため、2本が同時に走ると
# 後からpushした側が弾かれ、その回の検知結果が丸ごと消える(実際に2026-08-28に
# クジラ検知が1件失われた)。同時実行そのものを起こさないよう、cronの分も
# 互いに3分以上ずらしてある。
concurrency:
  group: trading-repo-write
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install requests

      - name: 投稿チェック&通知
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # X_COOLDOWN_MINUTES は任意設定。Secretsが未設定だと空文字列が渡り
          # スクリプト側のデフォルト値処理が壊れるため、変更したい場合のみ値を設定して追加してください。
          # X_COOLDOWN_MINUTES: ${{ secrets.X_COOLDOWN_MINUTES }}
        run: python x_signal_notifier.py

      - name: 状態ファイル&DBをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x_signal_state.json trading_system.db
          git diff --staged --quiet || git commit -m "update x signal state"
          # 直列化していても手動実行や手元からのpushと重なることはあるため、
          # 弾かれたらリモートを取り込んで再試行する(取り込めない場合は
          # 黙って失うより落とした方が安全なのでエラー終了する)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "pushが弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash || exit 1
          done
          git push
