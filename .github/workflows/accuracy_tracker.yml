# .github/workflows/accuracy_tracker.yml に配置してください。
# 1時間おきに実行: シグナルの結果検証(1h/24h)を行い、月曜日にサマリーをDiscordへ送信

name: Accuracy Tracker

on:
  schedule:
    - cron: "5 * * * *"  # 毎時5分に実行
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install requests

      - name: 的中率検証&レポート送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python accuracy_tracker.py

      - name: DBをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system.db
          git diff --staged --quiet || git commit -m "update signal outcomes"
          git push
