# .github/workflows/confluence_checker.yml に配置してください。
# crypto_signal_notifier.pyとx_signal_notifier.pyの両方の後に実行されるよう、
# 少しずらしたタイミングで30分おきに実行するのがおすすめです。

name: Confluence Checker

on:
  schedule:
    - cron: "6,36 * * * *"  # 毎時10分・40分に実行(元の通知より少し後にずらす)
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリ(trading_system.db等)に書き込むワークフローは、この共通グループで
# 直列化する。SQLiteのDBはバイナリでgitがマージできないため、2本が同時に走ると
# 後からpushした側が弾かれ、その回の検知結果が丸ごと消える(実際に2026-08-28に
# クジラ検知が1件失われた)。同時実行そのものを起こさないよう、cronの分も
# 互いに3分以上ずらしてある。
concurrency:
  group: trading-repo-write
  cancel-in-progress: false

jobs:
  check-confluence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install requests

      - name: コンフルエンスチェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python confluence_checker.py

      - name: DBをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system.db
          git diff --staged --quiet || git commit -m "update confluence log"
          # 直列化していても手動実行や手元からのpushと重なることはあるため、
          # 弾かれたらリモートを取り込んで再試行する(取り込めない場合は
          # 黙って失うより落とした方が安全なのでエラー終了する)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "pushが弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash || exit 1
          done
          git push
