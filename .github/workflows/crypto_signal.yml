# .github/workflows/crypto_signal.yml に配置してください。
# 30分おきに実行: CoinGeckoの価格からSMAクロス+RSIでLONG/SHORTを判定しDiscordに通知

name: Crypto Signal Notifier

on:
  schedule:
    - cron: "0,30 * * * *"  # 30分おき
  workflow_dispatch: {}

permissions:
  contents: write

# リポジトリ(trading_system.db等)に書き込むワークフローは、この共通グループで
# 直列化する。SQLiteのDBはバイナリでgitがマージできないため、2本が同時に走ると
# 後からpushした側が弾かれ、その回の検知結果が丸ごと消える(実際に2026-08-28に
# クジラ検知が1件失われた)。同時実行そのものを起こさないよう、cronの分も
# 互いに3分以上ずらしてある。
concurrency:
  group: trading-repo-write
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install requests pandas

      - name: シグナル判定&通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # RISK_PERCENT_PER_TRADE / DEFAULT_STOP_LOSS_PCT / CRYPTO_COOLDOWN_MINUTES は任意設定。
          # Secretsが未設定だと空文字列が渡りスクリプト側のデフォルト値処理が壊れるため、
          # カスタマイズしたい場合のみ下記のように値を設定して追加してください(空のまま追加しないこと)。
          # RISK_PERCENT_PER_TRADE: ${{ secrets.RISK_PERCENT_PER_TRADE }}
          # DEFAULT_STOP_LOSS_PCT: ${{ secrets.DEFAULT_STOP_LOSS_PCT }}
          # CRYPTO_COOLDOWN_MINUTES: ${{ secrets.CRYPTO_COOLDOWN_MINUTES }}
        run: python crypto_signal_notifier.py

      - name: DB・状態ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system.db crypto_signal_state.json
          git diff --staged --quiet || git commit -m "update signal log (crypto)"
          # 直列化していても手動実行や手元からのpushと重なることはあるため、
          # 弾かれたらリモートを取り込んで再試行する(取り込めない場合は
          # 黙って失うより落とした方が安全なのでエラー終了する)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "pushが弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash || exit 1
          done
          git push
