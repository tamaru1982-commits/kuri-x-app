name: TEMP Awakening Test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import crypto_signal_notifier as c
          dip_signals = [
              {'symbol': 'XRP', 'price': 1.38, 'rsi': 32.1, 'prev_rsi': 27.5},
              {'symbol': 'SOL', 'price': 95.2, 'rsi': 31.0, 'prev_rsi': 28.9},
          ]
          c.send_awakening_notification(dip_signals)
          "
